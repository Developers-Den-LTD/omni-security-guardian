name: Omni External Force-Push & Malware Guardian

on:
  workflow_dispatch:

concurrency:
  group: omni-external-guardian
  cancel-in-progress: false

jobs:
  monitor-omni-repos:
    name: Monitor All 34 Omni Repos for Force-Push & Malware
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout Guardian
        uses: actions/checkout@v4

      - name: Run Single Sweep Across All 34 Omni Repos
        env:
          ORG_GUARDIAN_TOKEN: ${{ secrets.ORG_GUARDIAN_TOKEN }}
          SINGLE_SWEEP: "1"
        run: node cloud_guardian.js
