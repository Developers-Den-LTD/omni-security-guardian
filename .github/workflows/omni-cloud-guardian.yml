name: Omni External Force-Push & Malware Guardian

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  group: omni-external-guardian
  cancel-in-progress: false

jobs:
  monitor-omni-repos:
    name: Monitor All 34 Omni Repos (Zero-Leak Masked Mode)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout Guardian
        uses: actions/checkout@v4

      - name: Run 4-Minute Continuous Guardian Poll (Every 20s)
        env:
          ORG_GUARDIAN_TOKEN: ${{ secrets.ORG_GUARDIAN_TOKEN }}
        run: node cloud_guardian.js
