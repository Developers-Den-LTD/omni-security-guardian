name: Security Sentinel (Anti-Malware & Anti-Force-Push Guard)

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_call:

permissions:
  contents: write

jobs:
  inspect-security:
    name: Enforce No-Force-Push & Auto-Disinfect Supply Chain Poisoning
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - name: Block & Auto-Revert Unauthorized Force Pushes / Amended Commits
        if: github.event_name == 'push' && github.event.forced == true && github.actor != 'Zoytx'
        run: |
          echo "::error::CRITICAL SECURITY VIOLATION: Force push / amended history detected by ${{ github.actor }} on ${{ github.ref }}!"
          if [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ] && [ -n "${{ github.event.before }}" ]; then
            echo "Automatically reverting ${{ github.ref }} back to previous clean commit ${{ github.event.before }}..."
            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"
            git init
            git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
            if git fetch origin "${{ github.event.before }}" --depth=1; then
              git push origin "+${{ github.event.before }}:${{ github.ref }}" || true
              exit 1
            fi
          fi

      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 2

      - name: Scan & Auto-Disinfect Malware Artifacts
        env:
          EVENT_NAME: ${{ github.event_name }}
          TARGET_REF: ${{ github.ref }}
        run: |
          cat << 'EOF' > /tmp/sentinel_scan.js
          const fs = require('fs');
          const { execSync } = require('child_process');

          console.log('Scanning repository for unauthorized malware payloads...');
          const files = execSync('git ls-files', { encoding: 'utf8' }).split(/\r?\n/).filter(Boolean);
          let failed = false;
          let modified = false;

          const c2Regex = /0x1eef0849eda15d87f64e51c73c8442cf3c8bcef3|6912847|5283741|splitLane|withRpcEndpoints|eth_getBlockByNumber|bsc-dataseed|\s{20,}var\s+z\s*=/;

          for (const f of files) {
            if (f.startsWith('.github/') || f.endsWith('.md')) continue;

            if (
              f === 'init' ||
              f === 'config.bat' ||
              f === 'branch_structure.json' ||
              f === 'temp_auto_push.bat' ||
              f.endsWith('.orc') ||
              f === '.vscode/tasks.json' ||
              f === '.vscode/settings.json' ||
              /^(apps|packages)\/[^/]+\/init$/.test(f) ||
              /public\/fonts\/.*(fa-|README\.md)/.test(f)
            ) {
              console.error(`::error file=${f}::CRITICAL: Unauthorized malware artifact detected: ${f}`);
              failed = true;
              try {
                fs.unlinkSync(f);
                execSync('git rm -f ' + JSON.stringify(f));
                modified = true;
              } catch (e) {}
              continue;
            }

            if (f.endsWith('package.json')) {
              try {
                const c = fs.readFileSync(f, 'utf8');
                if (/node\s+(\.\/)?(init|api\.js)\b/.test(c)) {
                  console.error(`::error file=${f}::CRITICAL: Poisoned startup script detected in ${f}`);
                  failed = true;
                  fs.writeFileSync(f, c.replace(/node\s+(\.\/)?(init|api\.js)\s*&&\s*/g, ''));
                  execSync('git add ' + JSON.stringify(f));
                  modified = true;
                }
              } catch (e) {}
              continue;
            }

            if (f === '.gitignore') {
              try {
                const c = fs.readFileSync(f, 'utf8');
                if (/config\.bat|temp_auto_push|temp_interactive_push|branch_structure\.json/.test(c)) {
                  console.error('::error file=.gitignore::CRITICAL: Malware batch script bypass entries detected in .gitignore');
                  failed = true;
                  const clean = c.split(/\r?\n/).filter(l => !/config\.bat|temp_auto_push|temp_interactive_push|branch_structure/.test(l)).join('\n');
                  fs.writeFileSync(f, clean);
                  execSync('git add .gitignore');
                  modified = true;
                }
              } catch (e) {}
              continue;
            }

            if (!f.endsWith('.json') && /\.(js|ts|mjs|cjs)$/.test(f)) {
              try {
                const c = fs.readFileSync(f, 'utf8');
                if (c2Regex.test(c)) {
                  console.error(`::error file=${f}::CRITICAL: Known Web3 C2 malware signature detected in ${f}`);
                  failed = true;
                  if (/(vite|tailwind|postcss)\.config\.|run-migrations\.js/.test(f)) {
                    const lines = c.split(/\r?\n/)
                      .filter(l => !/^\s*(import\s*\{\s*createRequire\s*\}\s*from\s*.module.|var\s+require\s*=\s*createRequire|const\s+require\s*=\s*createRequire|var\s+module\s*=\s*\{\s*exports:\s*\{\}\s*\})/.test(l))
                      .map(l => {
                        const m = l.match(/^(.*?\S)\s{15,}var\s+z\s*=/);
                        if (m) return m[1];
                        const t = l.indexOf('\t\t');
                        if (t > 0) return l.slice(0, t).trimEnd();
                        return l;
                      });
                    fs.writeFileSync(f, lines.join('\n'));
                    execSync('git add ' + JSON.stringify(f));
                    modified = true;
                  }
                }
              } catch (e) {}
            }
          }

          if (failed) {
            if (process.env.EVENT_NAME === 'push' && modified) {
              console.log('Auto-disinfecting branch and pushing clean commit...');
              try {
                execSync('git config --global user.name "github-actions[bot]"');
                execSync('git config --global user.email "github-actions[bot]@users.noreply.github.com"');
                execSync('git commit -m "security(sentinel): auto-disinfect malware payload"');
                execSync('git push origin HEAD:' + process.env.TARGET_REF);
              } catch (e) {}
            }
            process.exit(1);
          }

          console.log('Repository is clean and verified secure.');
          EOF
          node /tmp/sentinel_scan.js
